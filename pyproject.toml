[project]
name = "audio-transcribe"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "gonkzz", email = "gs.goncalosoares@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "scipy>=1.17.1",
]

[project.scripts]
audio-transcribe = "audio_transcribe:main"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pytest>=9.1.1",
    "soundfile>=0.14.0",
]
