[project]
name = "audio-painter"
version = "0.1.0"
description = "Turning recordings into pictures, starting with a spectrogram."
readme = "README.md"
authors = [
    { name = "gonkzz", email = "gs.goncalosoares@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "scipy>=1.17.1",
]

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pyqt6>=6.11.0",
    "pytest>=9.1.1",
    "soundfile>=0.14.0",
]
